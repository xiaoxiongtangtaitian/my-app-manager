*{box-sizing:border-box}
body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:1150px;margin:auto;padding:30px 18px}
h1{font-size:32px;margin:0}

.danger{background:#ffe9e9;color:#b42339}

.top{display:flex;align-items:center;gap:13px}
